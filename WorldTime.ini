[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!Hide][!CommandMeasure MeasureScript "UpdateOffsets()"]

[Variables]
; --- TIME OFFSET SETTINGS ---
@include=Variables.inc

; --- APPEARANCE ---
MyFont=Arial Rounded MT Bold
TextFontSize=18
GridSize=40
PadSide=25
PadTopBottom=20
ColCityX=#PadSide#
ColTimeX=185
ColDayX=285
ColDateX=350

; --- COLORS ---
BgColor=0,0,0,64

[StyleText]
FontFace=#MyFont#
FontSize=#TextFontSize#
FontColor=255,255,255,255
StringStyle=Bold
StringEffect=Border
FontEffectColor=0,0,0,255
AntiAlias=1

[M_Local]
Measure=Time

; --- LOGIC ---

[T_Cal]
Measure=Time
TimeStamp=([M_Local:TimeStamp] + (#OffCal# * 3600))
Format=%H:%M
DynamicVariables=1
[D_Cal]
Measure=Time
TimeStamp=([M_Local:TimeStamp] + (#OffCal# * 3600))
Format=%a
Substitute="Mon":"Mo","Tue":"Tu","Wed":"We","Thu":"Th","Fri":"Fr","Sat":"Sa","Sun":"Su","Пн":"Пн","Вт":"Вт","Ср":"Ср","Чт":"Чт","Пт":"Пт","Сб":"Сб","Вс":"Вс"
DynamicVariables=1
[Date_Cal_M]
Measure=Time
TimeStamp=([M_Local:TimeStamp] + (#OffCal# * 3600))
Format=%d.%m.%Y
DynamicVariables=1

[T_Tor]
Measure=Time
TimeStamp=([M_Local:TimeStamp] + (#OffTor# * 3600))
Format=%H:%M
DynamicVariables=1
[D_Tor]
