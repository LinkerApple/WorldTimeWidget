; --- UI METERS ---

[M_Count]
Measure=Calc
Formula=6

[Backing]
Meter=Shape
Shape=Rectangle 0,0,530,(#PadTopBottom# * 2 + ([M_Count]-1) * #GridSize# + 26) | Fill Color #BgColor# | Stroke Color 0,0,0,0
DynamicVariables=1

[L_Cal]
