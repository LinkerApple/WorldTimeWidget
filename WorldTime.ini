[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!CommandMeasure P_Cal "Update"][!CommandMeasure P_Ber "Update"][!CommandMeasure P_Kyi "Update"][!CommandMeasure P_Mos "Update"][!CommandMeasure P_Del "Update"]

[Variables]
; --- offsets ---
cOff=-25200
bOff=3600
kOff=7200
mOff=10800
dOff=19800

; --- Layout Settings ---
MyFont=Arial Rounded MT Bold
TextFontSize=18
; Distance between rows
GridSize=40

; Padding inside the box
PadSide=25
PadTopBottom=20

; Column X positions (Starting from PadSide)
ColCityX=#PadSide#
ColTimeX=185
ColDayX=285
ColDateX=355

; Background Size (Fixed for perfect symmetry)
BGWidth=510
BGHeight=275

; --- Styles ---
BgColor=0,0,0,64

[StyleText]
FontFace=#MyFont#
FontSize=#TextFontSize#
FontColor=255,255,255,255
StringStyle=Bold
StringEffect=Border
FontEffectColor=0,0,0,255
AntiAlias=1

; --- Measures (UTC & WebParsers) ---
[M_UTC]
Measure=Time
TimeZone=0

[P_Cal]
Measure=WebParser
Url=http://worldtimeapi.org/api/timezone/America/Edmonton
RegExp="(?siU)raw_offset\":(-?\d+),.*dst_offset\":(\d+),"
UpdateRate=1800
FinishAction=[!UpdateMeasure *]

[P_Ber]
Measure=WebParser
Url=http://worldtimeapi.org/api/timezone/Europe/Berlin
RegExp="(?siU)raw_offset\":(-?\d+),.*dst_offset\":(\d+),"
UpdateRate=1800
FinishAction=[!UpdateMeasure *]

[P_Kyi]
Measure=WebParser
Url=http://worldtimeapi.org/api/timezone/Europe/Kyiv
RegExp="(?siU)raw_offset\":(-?\d+),.*dst_offset\":(\d+),"
UpdateRate=1800
FinishAction=[!UpdateMeasure *]

[P_Mos]
Measure=WebParser
Url=http://worldtimeapi.org/api/timezone/Europe/Moscow
RegExp="(?siU)raw_offset\":(-?\d+),.*dst_offset\":(\d+),"
UpdateRate=1800
FinishAction=[!UpdateMeasure *]

[P_Del]
Measure=WebParser
Url=http://worldtimeapi.org/api/timezone/Asia/Kolkata
RegExp="(?siU)raw_offset\":(-?\d+),.*dst_offset\":(\d+),"
UpdateRate=1800
FinishAction=[!UpdateMeasure *]

; --- Calc Logic ---
[M_Cal_V]
Measure=Calc
Formula=([P_Cal:1] + [P_Cal:2])
DynamicVariables=1
IfCondition=M_Cal_V <> 0
IfTrueAction=[!SetVariable cOff [M_Cal_V]]

[M_Ber_V]
Measure=Calc
Formula=([P_Ber:1] + [P_Ber:2])
DynamicVariables=1
IfCondition=M_Ber_V <> 0
IfTrueAction=[!SetVariable bOff [M_Ber_V]]

[M_Kyi_V]
Measure=Calc
Formula=([P_Kyi:1] + [P_Kyi:2])
DynamicVariables=1
IfCondition=M_Kyi_V <> 0
IfTrueAction=[!SetVariable kOff [M_Kyi_V]]

[M_Mos_V]
Measure=Calc
Formula=([P_Mos:1] + [P_Mos:2])
DynamicVariables=1
IfCondition=M_Mos_V <> 0
IfTrueAction=[!SetVariable mOff [M_Mos_V]]

[M_Del_V]
Measure=Calc
Formula=([P_Del:1] + [P_Del:2])
DynamicVariables=1
IfCondition=M_Del_V <> 0
IfTrueAction=[!SetVariable dOff [M_Del_V]]

[C_Cal_TS]
Measure=Calc
Formula=([M_UTC:TimeStamp] + #cOff#)
DynamicVariables=1
[C_Ber_TS]
Measure=Calc
Formula=([M_UTC:TimeStamp] + #bOff#)
DynamicVariables=1
[C_Kyi_TS]
Measure=Calc
Formula=([M_UTC:TimeStamp] + #kOff#)
DynamicVariables=1
[C_Mos_TS]
Measure=Calc
Formula=([M_UTC:TimeStamp] + #mOff#)
DynamicVariables=1
[C_Del_TS]
Measure=Calc
Formula=([M_UTC:TimeStamp] + #dOff#)
DynamicVariables=1

; --- Time Displays ---
[T_Cal]
Measure=Time
TimeStamp=[C_Cal_TS]
Format=%H:%M
DynamicVariables=1
[D_Cal_Day]
Measure=Time
TimeStamp=[C_Cal_TS]
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
DynamicVariables=1
[D_Cal_Date]
Measure=Time
TimeStamp=[C_Cal_TS]
Format=%d.%m.%Y
DynamicVariables=1

[T_UTC]
Measure=Time
TimeZone=0
Format=%H:%M
[D_UTC_Day]
Measure=Time
TimeZone=0
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
[D_UTC_Date]
Measure=Time
TimeZone=0
Format=%d.%m.%Y

[T_Ber]
Measure=Time
TimeStamp=[C_Ber_TS]
Format=%H:%M
DynamicVariables=1
[D_Ber_Day]
Measure=Time
TimeStamp=[C_Ber_TS]
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
DynamicVariables=1
[D_Ber_Date]
Measure=Time
TimeStamp=[C_Ber_TS]
Format=%d.%m.%Y
DynamicVariables=1

[T_Kyi]
Measure=Time
TimeStamp=[C_Kyi_TS]
Format=%H:%M
DynamicVariables=1
[D_Kyi_Day]
Measure=Time
TimeStamp=[C_Kyi_TS]
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
DynamicVariables=1
[D_Kyi_Date]
Measure=Time
TimeStamp=[C_Kyi_TS]
Format=%d.%m.%Y
DynamicVariables=1

[T_Mos]
Measure=Time
TimeStamp=[C_Mos_TS]
Format=%H:%M
DynamicVariables=1
[D_Mos_Day]
Measure=Time
TimeStamp=[C_Mos_TS]
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
DynamicVariables=1
[D_Mos_Date]
Measure=Time
TimeStamp=[C_Mos_TS]
Format=%d.%m.%Y
DynamicVariables=1

[T_Del]
Measure=Time
TimeStamp=[C_Del_TS]
Format=%H:%M
DynamicVariables=1
[D_Del_Day]
Measure=Time
TimeStamp=[C_Del_TS]
Format=%a
RegExpSubstitute=1
Substitute="^(.{2}).*$":"\1"
DynamicVariables=1
[D_Del_Date]
Measure=Time
TimeStamp=[C_Del_TS]
Format=%d.%m.%Y
DynamicVariables=1

; --- UI ---
[Backing]
Meter=Shape
Shape=Rectangle 0,0,#BGWidth#,#BGHeight# | Fill Color #BgColor# | Stroke Color 0,0,0,0

[L_Cal]
Meter=String
MeterStyle=StyleText
Text="Calgary"
X=#ColCityX#
Y=#PadTopBottom#

[V_Cal]
Meter=String
MeterStyle=StyleText
MeasureName=T_Cal
X=#ColTimeX#
Y=0r

[Day_Cal]
